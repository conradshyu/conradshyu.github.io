<canvas></canvas>
<div class="ui accordion">
    <div class="title">
        <i class="dropdown icon" style="color: blue;"></i>
        Control Panel
    </div>
    <div class="content">
        <table class="ui compact celled table" style="width: 100%;">
            <thead>
                <tr>
                    <th style="width: 25%;">Parameter</th>
                    <th style="width: 25%;">Value</th>
                    <th style="width: 25%;">Parameter</th>
                    <th>Value</th>
                </tr>
            </thead>
            <tbody>
                <tr>
                    <td>Figure Title</td>
                    <td>
                        <div class="ui small input" style="width: 100%;">
                            <input type="text" placeholder="Figure title ..."
                                onkeyup="DDX.active.chart.options.plugins.title.text = this.value; DDX.active.chart.update();">
                        </div>
                    </td>
                    <td>Legend Font Size</td>
                    <td>
                        <div class="ui small input" style="width: 100%;">
                            <input type="text" placeholder="Legend font size ..."
                                onkeyup="DDX.active.chart.options.plugins.legend.labels.font.size = this.value; DDX.active.chart.update();">
                        </div>
                    </td>
                </tr>
                <tr>
                    <td>Title Font Size</td>
                    <td>
                        <div class="ui small input" style="width: 100%;">
                            <input type="text" placeholder="Title font size ..."
                                onkeyup="DDX.active.chart.options.plugins.title.font.size = this.value; DDX.active.chart.update();">
                        </div>
                    </td>
                    <td>Legend Position</td>
                    <td>
                        <div class="ui small selection dropdown" style="width: 100%;">
                            <input type="hidden">
                            <i class="dropdown icon"></i>
                            <div class="default text">Select Position</div>
                            <div class="menu">
                                <div class="item" data-value="top">Top</div>
                                <div class="item" data-value="bottom">Bottom</div>
                                <div class="item" data-value="left">Left</div>
                                <div class="item" data-value="right">Right</div>
                                <div class="item" data-value="chartArea">Chart Area</div>
                            </div>
                        </div>
                    </td>
                </tr>
                <tr>
                    <td>X-Axis Title</td>
                    <td>
                        <div class="ui small input" style="width: 100%;">
                            <input type="text" placeholder="X-axis title ..."
                                onkeyup="DDX.active.chart.options.scales.x.title.text = this.value; DDX.active.chart.update();">
                        </div>
                    </td>
                    <td>Y-Axis Title</td>
                    <td>
                        <div class="ui small input" style="width: 100%;">
                            <input type="text" placeholder="Y-axis title ..."
                                onkeyup="DDX.active.chart.options.scales.y.title.text = this.value; DDX.active.chart.update();">
                        </div>
                    </td>
                </tr>
                <tr>
                    <td>X-Axis Font Size</td>
                    <td>
                        <div class="ui small input" style="width: 100%;">
                            <input type="text" placeholder="X-axis font size ..."
                                onkeyup="DDX.active.chart.options.scales.x.title.font.size = this.value; DDX.active.chart.update();">
                        </div>
                    </td>
                    <td>Y-Axis Font Size</td>
                    <td>
                        <div class="ui small input" style="width: 100%;">
                            <input type="text" placeholder="Y-axis font size ..."
                                onkeyup="DDX.active.chart.options.scales.y.title.font.size = this.value; DDX.active.chart.update();">
                        </div>
                    </td>
                </tr>
                <tr>
                    <td>X-Axis Tick Size</td>
                    <td>
                        <div class="ui small input" style="width: 100%;">
                            <input type="text" placeholder="X-axis tick font size ..."
                                onkeyup="DDX.active.chart.options.scales.x.ticks.font.size = this.value; DDX.active.chart.update();">
                        </div>
                    </td>
                    <td>Y-Axis Tick Size</td>
                    <td>
                        <div class="ui small input" style="width: 100%;">
                            <input type="text" placeholder="Y-axis tick font size ..."
                                onkeyup="DDX.active.chart.options.scales.y.ticks.font.size = this.value; DDX.active.chart.update();">
                        </div>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>
</div>
<script>
    (() => {
        window.chartColors = {
            red: 'rgb(255, 99, 132)',
            orange: 'rgb(255, 159, 64)',
            yellow: 'rgb(255, 205, 86)',
            green: 'rgb(75, 192, 192)',
            blue: 'rgb(54, 162, 235)',
            purple: 'rgb(153, 102, 255)',
            grey: 'rgb(201, 203, 207)'
        };

        Chart.defaults.font.size = 14;
        Chart.defaults.font.family = "'Helvetica Neue', 'Helvetica', 'Arial', sans-serif";
        Chart.defaults.font.style = "normal";
        Chart.defaults.font.weight = "normal";
        Chart.defaults.font.lineHeight = 1.2;

        let ctx = DDX["active"]["value"].find("canvas");
        DDX["active"]["chart"] = new Chart(ctx[0].getContext("2d"), {
            type: 'line',
            data: {
                datasets: [],
            },
            options: {
                responsive: true,
                maintainAspectRatio: true,
                scales: {
                    y: {
                        title: {
                            display: true,
                            text: "Y Axis",
                            font: {
                                weight: "normal",
                                size: 12,
                                style: "normal",
                                family: "'Helvetica Neue', 'Helvetica', 'Arial', sans-serif",
                            },
                        },
                        ticks: {
                            font: {
                                weight: "normal",
                                size: 14,
                                style: "normal",
                                family: "'Helvetica Neue', 'Helvetica', 'Arial', sans-serif",
                            },
                        }
                    },
                    x: {
                        title: {
                            display: true,
                            text: "X Axis",
                            font: {
                                weight: "normal",
                                size: 12,
                                style: "normal",
                                family: "'Helvetica Neue', 'Helvetica', 'Arial', sans-serif",
                            },
                        },
                        ticks: {
                            maxTicksLimit: 25,
                            font: {
                                weight: "normal",
                                size: 14,
                                style: "normal",
                                family: "'Helvetica Neue', 'Helvetica', 'Arial', sans-serif",
                            },
                        }
                    },
                },
                plugins: {
                    legend: {
                        display: true,
                        position: 'bottom',
                        align: 'center',
                        labels: {
                            font: {
                                weight: "normal",
                                size: 14,
                                style: "normal",
                                family: "'Helvetica Neue', 'Helvetica', 'Arial', sans-serif",
                            },
                        }
                    },
                    title: {
                        display: true,
                        text: `Line Chart (${DDX["label"][1][0]})`,
                        position: "top",
                        color: "teal",
                        align: "center",
                        font: {
                            weight: "normal",
                            size: 24,
                            style: "normal",
                            family: "'Helvetica Neue', 'Helvetica', 'Arial', sans-serif",
                        },
                    },
                },
                animation: {
                    animateScale: true,
                    animateRotate: true
                }
            }
        });

        $.each(DDX["label"][2], (a, b) => {
            DDX.active.chart.data.datasets.push({
                label: DDX["label"][2][a],
                type: "line",
                borderWidth: 2,
                borderRadius: 3,
                data: DDX["json"].map(i => ({x: i[DDX["label"][1][0]], y: parseFloat(i[b]),})),
            });
        });

        DDX.active.chart.update();
        $("#stat_txt").html("Status: line chart completed.");

        $(".dropdown").dropdown({
            onChange: function (v) {
                DDX.active.chart.options.plugins.legend.position = v;
                DDX.active.chart.update();
            }
        });

        $('.ui.accordion').accordion();
        return true;
    })();
</script>
