<svg xmlns="http://www.w3.org/2000/svg" width="760" height="430" viewBox="0 0 760 430" role="img" aria-labelledby="title description">
  <title id="title">Ward hierarchical clustering setup</title>
  <desc id="description">Select numeric measurement variables, optionally select an observation label, and choose a cluster count.</desc>
  <rect width="760" height="430" rx="14" fill="#f7f9fc"/>
  <rect x="18" y="18" width="724" height="394" rx="12" fill="#fff" stroke="#d7dee8"/>
  <text x="42" y="57" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#243247">Multivariate: Ward Hierarchical Clustering</text>
  <text x="42" y="86" font-family="Arial, sans-serif" font-size="14" fill="#536176">Choose the variables used to measure distances between observations.</text>
  <rect x="38" y="112" width="214" height="216" rx="8" fill="#f8fafc" stroke="#d7dee8"/>
  <rect x="273" y="112" width="204" height="216" rx="8" fill="#f8fafc" stroke="#d7dee8"/>
  <rect x="498" y="112" width="224" height="216" rx="8" fill="#f8fafc" stroke="#d7dee8"/>
  <text x="54" y="141" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#243247">Available Variables</text>
  <text x="290" y="141" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#243247">Row Label (Optional)</text>
  <text x="515" y="141" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#243247">Measurements</text>
  <g font-family="Arial, sans-serif" font-size="14" fill="#34445a">
    <rect x="53" y="158" width="183" height="35" rx="5" fill="#fff" stroke="#d7dee8"/><text x="66" y="181">Species</text>
    <rect x="53" y="201" width="183" height="35" rx="5" fill="#fff" stroke="#d7dee8"/><text x="66" y="224">Sepal Length</text>
    <rect x="53" y="244" width="183" height="35" rx="5" fill="#fff" stroke="#d7dee8"/><text x="66" y="267">Petal Length</text>
    <rect x="289" y="158" width="172" height="35" rx="5" fill="#e8f4f3" stroke="#62aaa4"/><text x="302" y="181">Species</text>
    <rect x="514" y="158" width="192" height="35" rx="5" fill="#e8f4f3" stroke="#62aaa4"/><text x="527" y="181">Sepal Length</text>
    <rect x="514" y="201" width="192" height="35" rx="5" fill="#e8f4f3" stroke="#62aaa4"/><text x="527" y="224">Petal Length</text>
  </g>
  <text x="515" y="270" font-family="Arial, sans-serif" font-size="13" fill="#536176">Number of clusters</text>
  <rect x="514" y="281" width="80" height="32" rx="4" fill="#fff" stroke="#aab5c4"/>
  <text x="544" y="303" font-family="Arial, sans-serif" font-size="15" fill="#243247">3</text>
  <rect x="38" y="351" width="684" height="39" rx="6" fill="#edf6f5"/>
  <text x="54" y="376" font-family="Arial, sans-serif" font-size="14" fill="#286d68">Ward's method merges the pair of clusters with the smallest increase in within-cluster variance.</text>
</svg>
