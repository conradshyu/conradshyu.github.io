<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="520" viewBox="0 0 1000 520" role="img" aria-labelledby="title description">
  <title id="title">Heatmap variable-selection dialog</title>
  <desc id="description">A chart dialog with a record label and numerical variables selected for a heatmap.</desc>
  <rect width="1000" height="520" fill="#d9dde1"/>
  <rect x="36" y="24" width="928" height="472" rx="8" fill="#fff" stroke="#b8bec5"/>
  <rect x="36" y="24" width="928" height="58" rx="8" fill="#f7f7f7"/>
  <text x="68" y="62" font-family="Arial, sans-serif" font-size="25" font-weight="700" fill="#333">Chart: Heatmap</text>
  <text x="72" y="113" font-family="Arial, sans-serif" font-size="16" fill="#333">Choose one record label and one or more numerical variables.</text>
  <text x="72" y="138" font-family="Arial, sans-serif" font-size="15" fill="#555">Every selected value must be finite and numerical.</text>
  <g font-family="Arial, sans-serif" text-anchor="middle">
    <text x="212" y="184" font-size="17" font-weight="700" fill="#333">Select Variables</text>
    <text x="500" y="184" font-size="17" font-weight="700" fill="#333">Record Label</text>
    <text x="788" y="184" font-size="17" font-weight="700" fill="#333">Numerical Values</text>
  </g>
  <g fill="#fff" stroke="#d4d8dc">
    <rect x="70" y="198" width="284" height="226" rx="4"/>
    <rect x="358" y="198" width="284" height="226" rx="4"/>
    <rect x="646" y="198" width="284" height="226" rx="4"/>
  </g>
  <g font-family="Arial, sans-serif" font-size="16">
    <g fill="#f8ffff" stroke="#2185d0">
      <rect x="91" y="218" width="242" height="34" rx="4"/>
      <rect x="91" y="260" width="242" height="34" rx="4"/>
      <rect x="91" y="302" width="242" height="34" rx="4"/>
      <rect x="91" y="344" width="242" height="34" rx="4"/>
      <rect x="91" y="386" width="242" height="26" rx="4"/>
    </g>
    <g fill="#333">
      <text x="111" y="241">feature</text>
      <text x="111" y="283">label</text>
      <text x="111" y="325">abnormal</text>
      <text x="111" y="367">tuberculosis</text>
      <text x="111" y="405">pneumonia</text>
    </g>
    <g fill="#eaf4fb" stroke="#2185d0">
      <rect x="383" y="218" width="234" height="38" rx="4"/>
      <rect x="671" y="218" width="234" height="38" rx="4"/>
      <rect x="671" y="266" width="234" height="38" rx="4"/>
      <rect x="671" y="314" width="234" height="38" rx="4"/>
    </g>
    <g fill="#333">
      <text x="405" y="243">label</text>
      <text x="693" y="243">abnormal</text>
      <text x="693" y="291">tuberculosis</text>
      <text x="693" y="339">pneumonia</text>
    </g>
  </g>
  <rect x="36" y="444" width="928" height="52" fill="#fafafa"/>
  <rect x="783" y="455" width="94" height="30" rx="4" fill="#dedede"/>
  <rect x="888" y="455" width="56" height="30" rx="4" fill="#2185d0"/>
  <text x="830" y="475" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#333">Cancel</text>
  <text x="916" y="475" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#fff">Run</text>
</svg>
