<svg xmlns="http://www.w3.org/2000/svg" width="900" height="420" viewBox="0 0 900 420" role="img" aria-labelledby="title desc">
  <title id="title">Ridge regression observed versus predicted values</title>
  <desc id="desc">An illustrative scatter plot with observed points, a predicted reference line, and a model summary showing Ridge alpha and coefficients.</desc>
  <rect width="900" height="420" rx="14" fill="#fff"/>
  <text x="450" y="38" text-anchor="middle" fill="#087f8c" font-family="Arial, sans-serif" font-size="24">Ridge Regression</text>
  <g stroke="#d9e1e8" stroke-width="1">
    <path d="M92 90H590M92 150H590M92 210H590M92 270H590M92 330H590"/>
    <path d="M150 80V330M250 80V330M350 80V330M450 80V330M550 80V330"/>
  </g>
  <path d="M92 330L590 80" fill="none" stroke="#367dd6" stroke-width="3"/>
  <g fill="#e14b58" stroke="#fff" stroke-width="2">
    <circle cx="142" cy="304" r="7"/><circle cx="190" cy="278" r="7"/>
    <circle cx="228" cy="270" r="7"/><circle cx="278" cy="229" r="7"/>
    <circle cx="320" cy="242" r="7"/><circle cx="354" cy="204" r="7"/>
    <circle cx="407" cy="191" r="7"/><circle cx="448" cy="157" r="7"/>
    <circle cx="491" cy="146" r="7"/><circle cx="541" cy="112" r="7"/>
  </g>
  <path d="M92 330H590M92 330V80" fill="none" stroke="#52616b" stroke-width="2"/>
  <text x="341" y="370" text-anchor="middle" fill="#394957" font-family="Arial, sans-serif" font-size="16">Predicted Y</text>
  <text x="28" y="205" text-anchor="middle" transform="rotate(-90 28 205)" fill="#394957" font-family="Arial, sans-serif" font-size="16">Observed Y</text>
  <g font-family="Arial, sans-serif" fill="#394957">
    <text x="630" y="90" font-size="18" font-weight="bold">Model summary</text>
    <text x="630" y="132" font-size="15">Intercept</text><text x="850" y="132" text-anchor="end" font-size="15">0.142</text>
    <text x="630" y="169" font-size="15">Alpha (L2 penalty)</text><text x="850" y="169" text-anchor="end" font-size="15">1.000</text>
    <text x="630" y="206" font-size="15">Predictor A</text><text x="850" y="206" text-anchor="end" font-size="15">0.684</text>
    <text x="630" y="243" font-size="15">Predictor B</text><text x="850" y="243" text-anchor="end" font-size="15">0.211</text>
    <text x="630" y="280" font-size="15">R² Score</text><text x="850" y="280" text-anchor="end" font-size="15">0.817</text>
    <path d="M630 302H850" stroke="#d9e1e8"/>
    <circle cx="644" cy="333" r="6" fill="#e14b58"/>
    <text x="658" y="338" font-size="14">Observed</text>
    <path d="M748 333H782" stroke="#367dd6" stroke-width="3"/>
    <text x="790" y="338" font-size="14">Predicted</text>
  </g>
</svg>
