<svg xmlns="http://www.w3.org/2000/svg" width="900" height="520" viewBox="0 0 900 520" role="img" aria-labelledby="title description">
  <title id="title">Ward hierarchical clustering dendrogram</title>
  <desc id="description">A dendrogram showing six observations merging into two clusters at the selected Ward distance.</desc>
  <rect width="900" height="520" fill="#fff"/>
  <text x="450" y="38" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" fill="#167d78">Ward Hierarchical Clustering</text>
  <line x1="120" y1="430" x2="820" y2="430" stroke="#405064" stroke-width="2"/>
  <line x1="120" y1="90" x2="120" y2="430" stroke="#405064" stroke-width="2"/>
  <g font-family="Arial, sans-serif" font-size="13" fill="#536176">
    <text x="78" y="434">0</text><text x="62" y="352">2</text><text x="62" y="272">4</text><text x="62" y="192">6</text><text x="62" y="112">8</text>
    <text x="420" y="488" font-size="16">Observations</text>
    <text x="24" y="272" font-size="16" transform="rotate(-90 24 272)">Ward Distance</text>
  </g>
  <g stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M190 430 V390 H260 V430" stroke="#1f77b4"/>
    <path d="M400 430 V350 H470 V430" stroke="#1f77b4"/>
    <path d="M225 390 V270 H435 V350" stroke="#1f77b4"/>
    <path d="M610 430 V310 H680 V430" stroke="#ff7f0e"/>
    <path d="M645 310 V150 H330 V270" stroke="#64748b"/>
  </g>
  <line x1="120" y1="230" x2="820" y2="230" stroke="#243247" stroke-width="2" stroke-dasharray="8 7"/>
  <rect x="673" y="205" width="145" height="22" rx="4" fill="#fff"/>
  <text x="682" y="221" font-family="Arial, sans-serif" font-size="13" fill="#243247">Selected cluster cut</text>
  <g font-family="Arial, sans-serif" font-size="14" fill="#34445a" text-anchor="middle">
    <text x="190" y="455">A</text><text x="260" y="455">B</text><text x="400" y="455">C</text><text x="470" y="455">D</text><text x="610" y="455">E</text><text x="680" y="455">F</text>
  </g>
  <rect x="650" y="64" width="15" height="4" rx="2" fill="#1f77b4"/><text x="672" y="70" font-family="Arial, sans-serif" font-size="13" fill="#536176">Cluster 1</text>
  <rect x="756" y="64" width="15" height="4" rx="2" fill="#ff7f0e"/><text x="778" y="70" font-family="Arial, sans-serif" font-size="13" fill="#536176">Cluster 2</text>
</svg>
