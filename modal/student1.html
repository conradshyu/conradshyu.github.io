<i class="close icon"></i>
<div class="header">
    Univariate: Student's <i>t</i>-Test Two Samples
</div>
<div class="content" style="width: 100%;">
    <div class="ui segment" style="width: 100%;">
        <b>NOTE</b>: Drag and drop <b>only two</b> variables with numerical values as a group to determine whether two samples
        differ from each other (an independent two-sample <i>t</i>-Test).
    </div>
    <div class="ui grid">
        <div class="two column row" style="width: 100%; padding: 10px 10px 10px 10px;">
            <div class="column" style="text-align: center;">
                <strong>
                    Select Variables
                </strong>
                <div class="ui segment">
                    <div class="dnd_var" ondrop="DDX['lambda'](event);" ondragover="event.preventDefault();"
                        style="text-align: center;">
                    </div>
                </div>
            </div>
            <div class="column" style="text-align: center;">
                <strong>
                    Samples
                </strong>
                <div class="ui segment">
                    <div class="dnd_var" ondrop="DDX['lambda'](event);" ondragover="event.preventDefault();"
                        style="text-align: center;">
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
<div class="actions">
    <div class="ui black deny button">
        Cancel
    </div>
    <div class="ui positive right labeled icon button" onclick="DDX['update']();">
        Run
        <i class="checkmark icon"></i>
    </div>
</div>
<script>
    (() => {
        let ttype = 0;

        DDX["lambda"] = (e) => {
            e.preventDefault();
            $(e.target).append($(DDX["drag"]).get(0));

            $(".dnd_var").each((i, v) => {
                DDX["label"][i] = [];
                $.each($(v).children(), (a, b) => {
                    DDX["label"][i].push($(b).text().trim());
                });
            });
        }   // dynamically define function to handle drop event base on selection

        DDX["update"] = () => {
            if (DDX["label"][1].length !== 2) {
                window.alert("ERROR: Select only two variable with numerical values for group.");
                return false;
            }   // at least two variables as a group for comparison

            let pid = null;

            for (let i = 0; i < DDX["tab"].length; i++) {
                if (DDX["tab"][i]["text"].css("display") == "none") {
                    pid = DDX["tab"][i]; break;
                }
            }   // find first tab with display none

            DDX["active"] = pid;
            pid["text"].css("display", "block");
            pid["text"].children("span").html("Univariate: Student's <i>t</i>-Test Two Sample");  // update tab text

            DDX["post"] = {
                "t": "double",
                "g": DDX["label"][1],
                "data": DDX["json"],
            };  // send data to server
        }

        $(".dnd_var").each((a, b) => {
            $(b).css("height", `${DDX["header"].length * 35}px`);
        }); // set height

        $.each(DDX["header"], (a, b) => {
            $($(".dnd_var")[0]).append(
                `<button class="fluid compact ui labeled icon basic button" style="margin-bottom: 5px;" draggable="true" ondragstart="DDX['drag'] = this;"><i class="pause icon"></i>${b}</button>`);
        });
    })();
</script>
