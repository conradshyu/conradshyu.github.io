    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-8KPG39WEM0');

<i class="close icon"></i>
<div class="header">
    Chart: Histogram
</div>
<div class="content" style="width: 100%;">
    <div class="ui segment" style="width: 100%;">
        <b>NOTE</b>: Drag and drop exactly one numerical variable. The histogram counts observations in equal-width
        bins. All values must be finite numbers; missing values are not omitted. Choose between 1 and 1000 bins.
    </div>
    <div class="ui grid">
        <div class="two column row" style="width: 100%; padding: 10px;">
            <div class="column" style="text-align: center;">
                <strong>Select Variables</strong>
                <div class="ui segment">
                    <div class="dnd_var" ondrop="DDX['lambda'](event);" ondragover="event.preventDefault();"
                        style="text-align: center;"></div>
                </div>
            </div>
            <div class="column" style="text-align: center;">
                <strong>Numerical Variable</strong>
                <div class="ui segment">
                    <div class="dnd_var" ondrop="DDX['lambda'](event);" ondragover="event.preventDefault();"
                        style="text-align: center;"></div>
                </div>
                <div class="ui small input" style="width: 100%;">
                    <label for="histogramBins" style="padding: 8px;">Number of bins</label>
                    <input id="histogramBins" type="number" min="1" max="1000" step="1" value="10">
                </div>
            </div>
        </div>
    </div>
</div>
<div class="actions">
    <div class="ui black deny button">Cancel</div>
    <div class="ui positive right labeled icon button">
        Run
        <i class="checkmark icon"></i>
    </div>
</div>
<script>
    (() => {
        const dialog = $("#action");
        DDX["label"] = [[], []];
        DDX["lambda"] = (e) => {
            e.preventDefault();
            $(e.target).closest(".dnd_var").append($(DDX["drag"]).get(0));
            dialog.find(".dnd_var").each((i, v) => {
                DDX["label"][i] = $(v).children().map((a, b) => $(b).text().trim()).get();
            });
        };

        DDX["update"] = () => {
            if (DDX["label"][1].length != 1) {
                window.alert("ERROR: Select exactly one numerical variable.");
                return false;
            }
            const bins = Number(dialog.find("#histogramBins").val());
            if (!Number.isInteger(bins) || bins < 1 || bins > 1000) {
                window.alert("ERROR: Number of bins must be an integer between 1 and 1000.");
                return false;
            }
            const variable = DDX["label"][1][0];
            if (DDX["json"].some((row) => {
                const value = row[variable];
                return !((typeof value == "number" || (typeof value == "string" && value.trim() != "")) &&
                    Number.isFinite(Number(value)));
            })) {
                window.alert("ERROR: Selected variable must contain only finite numeric values.");
                return false;
            }
            const pid = DDX["tab"].find((tab) => tab["text"].css("display") == "none");
            if (!pid) {
                window.alert("ERROR: No result tab is available. Close an existing result tab and try again.");
                return false;
            }
            DDX["post"] = {
                "group": [variable],
                "bins": bins,
                "data": DDX["json"].map((row) => ({[variable]: Number(row[variable])})),
            };
            DDX["active"] = pid;
            pid["text"].css("display", "block");
            pid["text"].children("span").text("Chart: Histogram");
            pid["value"].load("export/histogram.html");
            return true;
        };

        // Validate before Semantic UI approves the modal and opens the result tab.
        dialog.modal("setting", "onApprove", () => DDX["update"]());
        dialog.find(".dnd_var").css("height", `${DDX["header"].length * 35}px`);
        $.each(DDX["header"], (a, b) => {
            $("<button>", {
                "class": "fluid compact ui labeled icon basic button",
                "style": "margin-bottom: 5px;",
                "draggable": "true",
                "ondragstart": "DDX['drag'] = this;",
            }).append('<i class="pause icon"></i>').append(document.createTextNode(b))
                .appendTo(dialog.find(".dnd_var").eq(0));
        });
    })();
</script>
