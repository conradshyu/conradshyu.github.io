<canvas></canvas>
<div class="ui accordion">
    <div class="title">
        <i class="dropdown icon" style="color: blue;"></i>
        Frequency Table and Control Panel
    </div>
    <div class="content">
        <div class="ui grid">
            <div class="eight wide column">
                <div class="ui header" style="text-align: center;">Frequency Table</div>
                <p class="histogram-summary"></p>
                <table class="ui celled compact table" style="width: 100%;">
                    <thead><tr><th>Bin Interval</th><th>Frequency</th></tr></thead>
                    <tbody></tbody>
                </table>
            </div>
            <div class="eight wide column">
                <div class="ui header" style="text-align: center;">Control Panel</div>
                <table class="ui compact celled table" style="width: 100%;">
                    <thead><tr><th style="width: 40%;">Parameter</th><th>Value</th></tr></thead>
                    <tbody>
                        <tr><td>Figure Title</td><td><div class="ui small input" style="width: 100%;">
                            <input class="histogram-title" type="text" placeholder="Figure title ...">
                        </div></td></tr>
                        <tr><td>Title Font Size</td><td><div class="ui small input" style="width: 100%;">
                            <input class="histogram-font" type="number" min="1" placeholder="Title font size ...">
                        </div></td></tr>
                        <tr><td>X-Axis Title</td><td><div class="ui small input" style="width: 100%;">
                            <input class="histogram-x" type="text" placeholder="X-axis title ...">
                        </div></td></tr>
                        <tr><td>Y-Axis Title</td><td><div class="ui small input" style="width: 100%;">
                            <input class="histogram-y" type="text" placeholder="Y-axis title ...">
                        </div></td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>
<script>
    (() => {
        const pid = DDX["active"];
        const post = JSON.stringify(DDX["post"]);
        const canvas = pid["value"].find("canvas")[0];
        const panel = pid["value"];

        (async () => {
            const modal = document.getElementById("loadingModal");
            modal.classList.add("active");
            $("#stat_txt").text("Status: histogram running.");
            try {
                const source = await fetch("execs/histogram.py");
                if (!source.ok) {
                    throw new Error(`Unable to load histogram implementation (${source.status}).`);
                }
                DDX.pyodide.runPython(await source.text());
                const run = DDX.pyodide.globals.get("run");
                let output;
                try {
                    output = JSON.parse(run(post));
                } finally {
                    run.destroy();
                }
                if (!panel.find("canvas").toArray().includes(canvas)) {
                    return;
                }   // The tab may have been closed or reused while loading Python.
                const intervals = output.counts.map((count, i) =>
                    `[${output.edges[i]}, ${output.edges[i + 1]}${i == output.counts.length - 1 ? "]" : ")"}`);
                pid["chart"] = new Chart(canvas.getContext("2d"), {
                    type: "bar",
                    data: {
                        labels: intervals,
                        datasets: [{
                            label: output.variable,
                            data: output.counts,
                            backgroundColor: "rgb(54, 162, 235)",
                            borderColor: "white",
                            borderWidth: 1,
                            borderRadius: 0,
                            categoryPercentage: 1,
                            barPercentage: 1,
                        }],
                    },
                    options: {
                        responsive: true,
                        maintainAspectRatio: true,
                        scales: {
                            x: {
                                title: {display: true, text: output.variable},
                                ticks: {maxTicksLimit: 25},
                            },
                            y: {
                                beginAtZero: true,
                                title: {display: true, text: "Frequency"},
                                ticks: {precision: 0},
                            },
                        },
                        plugins: {
                            legend: {display: false},
                            title: {
                                display: true,
                                text: `Histogram (${output.variable})`,
                                position: "top",
                                color: "teal",
                                align: "center",
                                font: {size: 24},
                            },
                        },
                    },
                });
                panel.find(".histogram-summary").text(
                    `${output.observations} observations; ${output.counts.length} equal-width bins. ` +
                    "Lower bounds are included; only the last bin includes its upper bound.");
                const body = panel.find("table").first().children("tbody").empty();
                output.counts.forEach((count, i) => {
                    $("<tr>").append($("<td>").text(intervals[i]), $("<td>").text(count)).appendTo(body);
                });
                panel.find(".histogram-title").on("input", function () {
                    pid.chart.options.plugins.title.text = this.value;
                    pid.chart.update();
                });
                panel.find(".histogram-font").on("input", function () {
                    if (Number(this.value) > 0) {
                        pid.chart.options.plugins.title.font.size = Number(this.value);
                        pid.chart.update();
                    }
                });
                ["x", "y"].forEach((axis) => {
                    panel.find(`.histogram-${axis}`).on("input", function () {
                        pid.chart.options.scales[axis].title.text = this.value;
                        pid.chart.update();
                    });
                });
                $("#stat_txt").text("Status: histogram completed.");
            } catch (error) {
                $("#stat_txt").text("Status: histogram failed.");
                window.alert(`Error: ${error}`);
            } finally {
                modal.classList.remove("active");
            }
        })();

        panel.find(".ui.accordion").accordion();
    })();
</script>
