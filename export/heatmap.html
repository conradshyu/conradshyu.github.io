<script>
    (() => {
        window.chartColors = {
            red: 'rgb(255, 99, 132)',
            orange: 'rgb(255, 159, 64)',
            yellow: 'rgb(255, 205, 86)',
            green: 'rgb(75, 192, 192)',
            blue: 'rgb(54, 162, 235)',
            purple: 'rgb(153, 102, 255)',
            grey: 'rgb(201, 203, 207)'
        };

        Chart.defaults.font.size = 14;
        Chart.defaults.font.family = "'Helvetica Neue', 'Helvetica', 'Arial', sans-serif";
        Chart.defaults.font.style = "normal";
        Chart.defaults.font.weight = "normal";

        let ctx = DDX["active"]["value"].find("canvas");

        const intensityScale = {
            afterDraw(chart) {
                const { ctx, chartArea } = chart;
                if (!chartArea) return;

                const barX = chartArea.right + 12;
                const barWidth = 40;
                const labelX = barX + barWidth + 8;
                const steps = 100;
                const gradient = ctx.createLinearGradient(0, chartArea.bottom, 0, chartArea.top);

                for (let step = 0; step <= steps; step++) {
                    gradient.addColorStop(step / steps, `rgba(75, 192, 192, ${step / steps})`);
                }

                ctx.save();
                ctx.fillStyle = gradient;
                ctx.fillRect(barX, chartArea.top, barWidth, chartArea.bottom - chartArea.top);
                ctx.strokeStyle = 'rgba(0, 0, 0, 0.2)';
                ctx.strokeRect(barX, chartArea.top, barWidth, chartArea.bottom - chartArea.top);

                ctx.font = '12px sans-serif';
                ctx.fillStyle = '#666';
                ctx.textAlign = 'left';
                ctx.textBaseline = 'middle';

                for (let tick = 0; tick <= 4; tick++) {
                    const ratio = tick / 4;
                    const y = chartArea.bottom - ratio * (chartArea.bottom - chartArea.top);
                    const value = Math.round(maxValue * ratio);

                    ctx.beginPath();
                    ctx.moveTo(barX + barWidth, y);
                    ctx.lineTo(barX + barWidth + 4, y);
                    ctx.stroke();
                    ctx.fillText(value, labelX + 4, y);
                }
                ctx.restore();
            }
        };

        const xLabels = DDX["label"][2];
        const yLabels = [];

        $.each(DDX["json"], (a, b) => {
            yLabels.push(b.Hour);
        });

        let maxValue = 0;
        const rawData = [];

        $.each(DDX["json"], (index, item) => {
            xLabels.forEach((day, x) => {
                rawData.push({
                    y: index,
                    x: x,
                    v: item[day]
                });

                maxValue = Math.max(maxValue, item[day]);
            });
        });

        DDX["active"]["chart"] = new Chart(ctx[0].getContext("2d"), {        
            type: "matrix",
            data: {
                datasets: [{
                    label: 'Activity Intensity',
                    data: rawData,
                    // Background color callback scales color dynamically based on the value 'v'
                    backgroundColor(context) {
                        const value = context.dataset.data[context.dataIndex].v;
                        return `rgba(75, 192, 192, ${value / maxValue})`; // Teal color block with variable alpha
                    },
                    borderColor: 'rgba(255, 255, 255, 1)', // Grid lines between heat block cells
                    borderWidth: 2,
                    // Calculate individual block dimensions relative to the grid area
                    width: ({ chart }) => (chart.chartArea || {}).width / xLabels.length,
                    height: ({ chart }) => (chart.chartArea || {}).height / yLabels.length
                }]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                layout: {
                    padding: {
                        right: 100
                    }
                },
                scales: {
                    x: {
                        type: "linear",
                        offset: true,
                        title: {
                            display: true,
                            text: "X Axis",
                            font: {
                                weight: "normal",
                                size: 14,
                                style: "normal",
                                family: "'Helvetica Neue', 'Helvetica', 'Arial', sans-serif",
                            }
                        },
                        ticks: {
                            stepSize: 1,
                            display: true,
                            maxTicksLimit: 25,
                            align: "center",
                            callback: (i) => xLabels[i],
                            font: {
                                weight: "normal",
                                size: 12,
                                style: "normal",
                                family: "'Helvetica Neue', 'Helvetica', 'Arial', sans-serif",
                            }
                        },
                        grid: {
                            display: false,
                            drawTicks: true
                        }
                    },
                    y: {
                        type: "linear",
                        offset: true,
                        title: {
                            display: true,
                            text: "Y Axis",
                            align: "center",
                            font: {
                                weight: "normal",
                                size: 14,
                                style: "normal",
                                family: "'Helvetica Neue', 'Helvetica', 'Arial', sans-serif",
                            }
                        },
                        ticks: {
                            stepSize: 1,
                            display: true,
                            callback: (i) => yLabels[i],
                            align: "center",
                            font: {
                                weight: "normal",
                                size: 12,
                                style: "normal",
                                family: "'Helvetica Neue', 'Helvetica', 'Arial', sans-serif",
                            }
                        },
                        grid: {
                            display: false,
                            drawTicks: true
                        }
                    }
                },
                plugins: {
                    legend: {
                        display: false
                    },
                    title: {
                        display: true,
                        text: `Heatmap (${DDX["label"][1][0]})`,
                        position: "top",
                        color: "teal",
                        align: "center",
                        font: {
                            weight: "normal",
                            size: 24,
                            style: "normal",
                            family: "'Helvetica Neue', 'Helvetica', 'Arial', sans-serif",
                        }
                    },
                    tooltip: {
                        callbacks: {
                            // Custom tooltip to show readable labels and the exact raw value
                            title() { return ''; },
                            label(context) {
                                const item = context.raw;
                                return `X: ${xLabels[item.x]}, Y: ${yLabels[item.y]} | Value: ${item.v}`;
                            }
                        }
                    }
                }
            },
            plugins: [intensityScale]
        });

        $(".dropdown").dropdown({
            onChange: function (v) {
                DDX.active.chart.options.plugins.legend.position = v;
                DDX.active.chart.update();
            }
        });

        $("#stat_txt").html("Status: heatmap chart completed.");
        $(".ui.accordion").accordion();
        return true;
    })();
</script>
