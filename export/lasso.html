<script>
    (() => {
        function load_table(tables) {
            const table = DDX.active.value.find("table");
            $(table[0]).children("thead").html(tables.analysis.thead);
            $(table[0]).children("tbody").html(tables.analysis.tbody);
            $(table[1]).children("thead").html(tables.summary.thead);
            $(table[1]).children("tbody").html(tables.summary.tbody);
        }

        function load_plot(data) {
            Chart.defaults.font.size = 14;
            Chart.defaults.font.family = "'Helvetica Neue', 'Helvetica', 'Arial', sans-serif";
            Chart.defaults.font.style = "normal";
            Chart.defaults.font.weight = "normal";
            Chart.defaults.font.lineHeight = 1.2;

            const ctx = DDX.active.value.find("canvas");
            DDX.active.chart = new Chart(ctx[0].getContext("2d"), {
                type: "scatter",
                data: {
                    datasets: [{
                        label: "Observed",
                        type: "scatter",
                        pointRadius: 5,
                        data: data.observe.sort((a, b) => a.x - b.x),
                    }, {
                        label: "Predicted",
                        type: "line",
                        borderWidth: 2,
                        pointRadius: 0,
                        data: data.predict.sort((a, b) => a.x - b.x),
                    }],
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: true,
                    scales: {
                        x: {
                            title: {
                                display: true,
                                text: "Predicted Y",
                                font: {
                                    weight: "normal",
                                    size: 12,
                                    style: "normal",
                                    family: "'Helvetica Neue', 'Helvetica', 'Arial', sans-serif",
                                },
                            },
                            ticks: {
                                font: {
                                    weight: "normal",
                                    size: 14,
                                    style: "normal",
                                    family: "'Helvetica Neue', 'Helvetica', 'Arial', sans-serif",
                                },
                            }
                        },
                        y: {
                            title: {
                                display: true,
                                text: "Observed Y",
                                font: {
                                    weight: "normal",
                                    size: 12,
                                    style: "normal",
                                    family: "'Helvetica Neue', 'Helvetica', 'Arial', sans-serif",
                                },
                            },
                            ticks: {
                                font: {
                                    weight: "normal",
                                    size: 14,
                                    style: "normal",
                                    family: "'Helvetica Neue', 'Helvetica', 'Arial', sans-serif",
                                }
                            }
                        }
                    },
                    plugins: {
                        legend: {
                            display: true,
                            position: "bottom",
                            align: "center",
                            labels: {
                                font: {
                                    weight: "normal",
                                    size: 14,
                                    style: "normal",
                                    family: "'Helvetica Neue', 'Helvetica', 'Arial', sans-serif",
                                },
                            }
                        },
                        title: {
                            display: true,
                            text: "Lasso Regression",
                            position: "top",
                            color: "teal",
                            align: "center",
                            font: {
                                weight: "normal",
                                size: 20,
                                style: "normal",
                                family: "'Helvetica Neue', 'Helvetica', 'Arial', sans-serif",
                            }
                        }
                    },
                    animations: {
                        animateScale: true,
                        animateRotate: true
                    }
                }
            });
        }

        $(".dropdown").dropdown({
            onChange: function (value) {
                DDX.active.chart.options.plugins.legend.position = value;
                DDX.active.chart.update();
            }
        });

        (async () => {
            const modal = document.getElementById("loadingModal");
            modal.classList.add("active");
            try {
                const source = await fetch("execs/lasso.py");
                DDX.pyodide.runPython(await source.text());
                const result = DDX.pyodide.globals.get("run")(JSON.stringify(DDX.post));
                const output = JSON.parse(result);
                load_plot(output.data);
                load_table(output.table);
            } catch (error) {
                window.alert(`Error: ${error}`);
            } finally {
                $("#stat_txt").html("Status: lasso regression completed.");
                modal.classList.remove("active");
            }
        })();

        $(".ui.accordion").accordion();
    })();
</script>
