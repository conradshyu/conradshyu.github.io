<script>
    (() => {
        function loadTable(table) {
            const element = DDX.active.value.find("table")[0];
            $(element).children("thead").html(table.thead);
            $(element).children("tbody").html(table.tbody);
        }

        function loadPlot(tree) {
            Chart.defaults.font.size = 14;
            Chart.defaults.font.family = "'Helvetica Neue', 'Helvetica', 'Arial', sans-serif";
            Chart.defaults.font.style = "normal";
            Chart.defaults.font.weight = "normal";
            Chart.defaults.font.lineHeight = 1.2;

            const labels = tree.labels;
            const datasets = tree.branches.map((branch) => ({
                data: branch.data,
                borderColor: branch.color,
                borderWidth: 2,
                pointRadius: 0,
                showLine: true,
                fill: false,
            }));

            datasets.push({
                label: "Cluster cut",
                data: [{x: 0, y: tree.cut_distance}, {x: Math.max(0, labels.length - 1), y: tree.cut_distance}],
                borderColor: "#111827",
                borderDash: [6, 4],
                borderWidth: 1,
                pointRadius: 0,
                showLine: true,
                fill: false,
            });

            const canvas = DDX.active.value.find("canvas")[0];
            DDX.active.chart = new Chart(canvas.getContext("2d"), {
                type: "scatter",
                data: {
                    datasets
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: true,
                    parsing: false,
                    scales: {
                        x: {
                            type: "linear",
                            min: 0,
                            max: Math.max(1, labels.length - 1),
                            title: {
                                display: true,
                                text: "Predicted Y",
                                font: {
                                    weight: "normal",
                                    size: 12,
                                    style: "normal",
                                    family: "'Helvetica Neue', 'Helvetica', 'Arial', sans-serif",
                                },
                            },
                            ticks: {
                                font: {
                                    weight: "normal",
                                    size: 14,
                                    style: "normal",
                                    family: "'Helvetica Neue', 'Helvetica', 'Arial', sans-serif",
                                },
                                stepSize: 1,
                                autoSkip: true,
                                maxTicksLimit: 25,
                                callback: (value) => labels[Math.round(Number(value))] || "",
                            },
                        },
                        y: {
                            min: 0,
                            title: {
                                display: true,
                                text: "Ward Distance",
                                font: {
                                    weight: "normal",
                                    size: 12,
                                    style: "normal",
                                    family: "'Helvetica Neue', 'Helvetica', 'Arial', sans-serif"
                                }
                            },
                            ticks: {
                                font: {
                                    weight: "normal",
                                    size: 14,
                                    style: "normal",
                                    family: "'Helvetica Neue', 'Helvetica', 'Arial', sans-serif",
                                }
                            }
                        }
                    },
                    plugins: {
                        title: {
                            display: true,
                            text: "Ward Hierarchical Clustering",
                            position: "top",
                            color: "teal",
                            align: "center",
                            font: {
                                weight: "normal",
                                size: 20,
                                style: "normal",
                                family: "'Helvetica Neue', 'Helvetica', 'Arial', sans-serif",
                            }
                        }
                    },
                    animations: {
                        animateScale: true,
                        animateRotate: true
                    }
                }
            });
        }

        (async () => {
            const modal = document.getElementById("loadingModal");
            modal.classList.add("active");
            try {
                const source = await fetch("execs/ward.py");
                if (!source.ok) {
                    throw new Error(`Unable to load Ward clustering implementation (${source.status}).`);
                }
                DDX.pyodide.runPython(await source.text());
                const result = DDX.pyodide.globals.get("run")(JSON.stringify(DDX.post));
                const output = JSON.parse(result);
                loadPlot(output.dendrogram);
                loadTable(output.table);
            } catch (error) {
                window.alert(`Error: ${error}`);
            } finally {
                $("#stat_txt").html("Status: Ward hierarchical clustering completed.");
                modal.classList.remove("active");
            }
        })();

        $(".ui.accordion").accordion();
    })();
</script>
